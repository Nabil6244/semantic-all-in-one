name: Publish Install Payloads

# Attach app + runtime archives to a GitHub Release and print sha256 values
# for pasting into tts/install_manifest.json. Model files stay on Hugging Face
# (use scripts/fill_model_manifest.py).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. install-v1.0.0)"
        required: true
        type: string
      app_windows_artifact:
        description: "Optional: workflow run id that produced SemanticAllInOne-Windows (leave empty to skip auto-download)"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "install-v*"

permissions:
  contents: write

jobs:
  publish:
    name: Attach payloads to Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download latest desktop / runtime artifacts (manual placement OK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          echo "Place or download these into release-assets/ before upload:"
          echo "  SemanticAllInOne-Windows.zip"
          echo "  SemanticAllInOne-macOS.zip   (zip of .app for the online installer)"
          echo "  qwen-runtime-win-amd64.zip"
          echo "  qwen-runtime-darwin-arm64.tar.gz"
          echo ""
          echo "Tip: download from Actions artifacts:"
          echo "  gh run download <run-id> -n SemanticAllInOne-Windows -D release-assets"
          echo "  gh run download <run-id> -n qwen-runtime-win-amd64 -D release-assets"
          ls -lah release-assets || true

      - name: Fetch artifacts via gh (best-effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # Latest successful Build Desktop Apps artifacts
          RUN_DESKTOP=$(gh run list -w "Build Desktop Apps" --limit 1 --json databaseId,conclusion -q '.[] | select(.conclusion=="success") | .databaseId' | head -1)
          RUN_RUNTIME=$(gh run list -w "Build Qwen Runtime" --limit 1 --json databaseId,conclusion -q '.[] | select(.conclusion=="success") | .databaseId' | head -1)
          set -e
          mkdir -p release-assets
          if [ -n "${RUN_DESKTOP}" ]; then
            gh run download "$RUN_DESKTOP" -n SemanticAllInOne-Windows -D release-assets || true
            gh run download "$RUN_DESKTOP" -n SemanticAllInOne-macOS-zip -D release-assets || true
            gh run download "$RUN_DESKTOP" -n SemanticAllInOne-macOS -D release-assets || true
          fi
          if [ -n "${RUN_RUNTIME}" ]; then
            gh run download "$RUN_RUNTIME" -n qwen-runtime-win-amd64 -D release-assets || true
            gh run download "$RUN_RUNTIME" -n qwen-runtime-darwin-arm64 -D release-assets || true
          fi
          ls -lah release-assets

      - name: Compute sha256 list
        run: |
          echo "## SHA-256 for install_manifest.json" > sha256-summary.md
          echo "" >> sha256-summary.md
          found=0
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sha256) continue ;;
              *.dmg) continue ;;  # installer consumes zip of .app
            esac
            found=1
            sum=$(sha256sum "$f" | awk '{print $1}')
            base=$(basename "$f")
            echo "- \`${base}\`: \`${sum}\`" >> sha256-summary.md
            echo "${sum}  ${base}"
          done
          if [ "$found" -eq 0 ]; then
            echo "No payload files found in release-assets/ — create an empty release notes stub only." >> sha256-summary.md
          fi
          cat sha256-summary.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES="$(cat sha256-summary.md)

          After uploading, paste the hashes into \`tts/install_manifest.json\` app/runtime entries.
          Fill model.files with: \`python scripts/fill_model_manifest.py --write\`
          "
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets."
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi
          shopt -s nullglob
          assets=(release-assets/*.zip release-assets/*.tar.gz)
          if [ ${#assets[@]} -gt 0 ]; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            echo "No zip/tar.gz assets to upload yet."
          fi
          gh release edit "$TAG" --notes "$NOTES"
