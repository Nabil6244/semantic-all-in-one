name: Publish Install Payloads

# Attach Qwen runtime archives to a GitHub Release and print sha256 values
# for tts/install_manifest.json. Model files stay on Hugging Face
# (use scripts/fill_model_manifest.py). Team app installers (DMG / Setup.exe)
# come from Build Desktop Apps artifacts — not this Release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. install-v1)"
        required: true
        type: string
  push:
    tags:
      - "install-v*"

permissions:
  contents: write

jobs:
  publish:
    name: Attach Qwen runtimes to Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Qwen runtime artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          RUN_RUNTIME=$(gh run list -w "Build Qwen Runtime" --limit 1 --json databaseId,conclusion -q '.[] | select(.conclusion=="success") | .databaseId' | head -1)
          set -e
          mkdir -p release-assets
          echo "Expected assets:"
          echo "  qwen-runtime-win-amd64.zip"
          echo "  qwen-runtime-darwin-arm64.zip"
          if [ -n "${RUN_RUNTIME}" ]; then
            gh run download "$RUN_RUNTIME" -n qwen-runtime-win-amd64 -D release-assets || true
            gh run download "$RUN_RUNTIME" -n qwen-runtime-darwin-arm64 -D release-assets || true
          fi
          ls -lah release-assets || true

      - name: Compute sha256 list
        run: |
          echo "## SHA-256 for install_manifest.json (Qwen runtime only)" > sha256-summary.md
          echo "" >> sha256-summary.md
          found=0
          for f in release-assets/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sha256) continue ;;
            esac
            found=1
            sum=$(sha256sum "$f" | awk '{print $1}')
            base=$(basename "$f")
            echo "- \`${base}\`: \`${sum}\`" >> sha256-summary.md
            echo "${sum}  ${base}"
          done
          if [ "$found" -eq 0 ]; then
            echo "No runtime files found — upload qwen-runtime-*.zip manually or re-run Build Qwen Runtime." >> sha256-summary.md
          fi
          cat sha256-summary.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES="$(cat sha256-summary.md)

          Team installers: download **Semantic-YT-Studio.dmg** and **Semantic-YT-Studio-Setup.exe** from Build Desktop Apps artifacts (not this Release).
          Paste runtime hashes into \`tts/install_manifest.json\`.
          Fill model.files with: \`python scripts/fill_model_manifest.py --write\`
          "
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets."
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi
          shopt -s nullglob
          assets=(release-assets/*.zip release-assets/*.tar.gz)
          if [ ${#assets[@]} -gt 0 ]; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            echo "No zip/tar.gz assets to upload yet."
          fi
          gh release edit "$TAG" --notes "$NOTES"
