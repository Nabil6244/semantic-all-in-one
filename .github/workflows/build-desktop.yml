name: Build Desktop Apps

on:
  push:
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Fetch ffmpeg (macOS)
        run: |
          mkdir -p bin
          # Runner images may ship untrusted taps (e.g. aws/tap) that warn on brew.
          brew untap aws/tap 2>/dev/null || true
          brew install ffmpeg
          cp "$(brew --prefix ffmpeg)/bin/ffmpeg" bin/ffmpeg
          chmod +x bin/ffmpeg
          ./bin/ffmpeg -version | head -1

      - name: Set up Node.js (for npm install only — not what gets bundled)
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install flow-engine dependencies
        run: |
          cd flow-engine
          npm install --omit=dev

      - name: Install YouTube browser-acquisition dependencies
        run: |
          cd providers/youtube/acquisition
          npm install --omit=dev

      - name: Bundle portable Node.js runtime (macOS arm64)
        # Playwright Chromium is NOT bundled; app downloads it once on first Flow/AI use.
        run: |
          NODE_VERSION="v24.19.0"
          curl -sL -o node.tar.gz "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-arm64.tar.gz"
          tar -xzf node.tar.gz
          cp "node-${NODE_VERSION}-darwin-arm64/bin/node" bin/node
          chmod +x bin/node
          ./bin/node --version

      - name: Build with PyInstaller
        run: pyinstaller VideoGenerator.spec

      - name: Create DMG
        run: |
          chmod +x scripts/make_dmg.sh
          ./scripts/make_dmg.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v5
        with:
          name: Semantic-YT-Studio.dmg
          path: dist/Semantic-YT-Studio.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows (Setup.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Fetch ffmpeg (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = "ffmpeg-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath ffmpeg_dl -Force
          $exe = Get-ChildItem -Path ffmpeg_dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in download" }
          Copy-Item $exe.FullName -Destination "bin\ffmpeg.exe"
          & "bin\ffmpeg.exe" -version | Select-Object -First 1
          $probe = Get-ChildItem -Path ffmpeg_dl -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $probe) { throw "ffprobe.exe not found in download" }
          Copy-Item $probe.FullName -Destination "bin\ffprobe.exe"

      - name: Set up Node.js (for npm install only — not what gets bundled)
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install flow-engine dependencies
        run: |
          cd flow-engine
          npm install --omit=dev

      - name: Install YouTube browser-acquisition dependencies
        run: |
          cd providers/youtube/acquisition
          npm install --omit=dev

      - name: Bundle portable Node.js runtime (Windows x64)
        shell: pwsh
        run: |
          $nodeVersion = "v24.19.0"
          $url = "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node_dl -Force
          Copy-Item "node_dl\node-$nodeVersion-win-x64\node.exe" -Destination "bin\node.exe"
          & "bin\node.exe" --version

      - name: Build with PyInstaller
        run: pyinstaller VideoGenerator.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          & $iscc "scripts\windows_setup.iss"
          if (-not (Test-Path "dist\Semantic-YT-Studio-Setup.exe")) {
            throw "Setup.exe was not produced"
          }

      - name: Upload Windows Setup.exe
        uses: actions/upload-artifact@v5
        with:
          name: Semantic-YT-Studio-Setup.exe
          path: dist/Semantic-YT-Studio-Setup.exe
          if-no-files-found: error
          retention-days: 14
