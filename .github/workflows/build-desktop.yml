name: Build Desktop Apps

on:
  push:
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS (.app + .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Fetch ffmpeg (macOS)
        run: |
          mkdir -p bin
          brew install ffmpeg
          cp "$(brew --prefix ffmpeg)/bin/ffmpeg" bin/ffmpeg
          chmod +x bin/ffmpeg
          ./bin/ffmpeg -version | head -1

      - name: Set up Node.js (for npm install only — not what gets bundled)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install flow-engine dependencies
        run: |
          cd flow-engine
          npm install --omit=dev

      - name: Install YouTube browser-acquisition dependencies
        run: |
          cd providers/youtube/acquisition
          npm install --omit=dev

      - name: Bundle portable Node.js runtime (macOS arm64)
        # This is the Node binary that SHIPS inside the app and runs flow-engine at
        # runtime on the end user's machine — a plain official download, standalone
        # (no Homebrew/shared-lib dependency), separate from the setup-node above
        # which only exists to run `npm install` during this CI build.
        run: |
          NODE_VERSION="v24.19.0"
          curl -sL -o node.tar.gz "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-arm64.tar.gz"
          tar -xzf node.tar.gz
          cp "node-${NODE_VERSION}-darwin-arm64/bin/node" bin/node
          chmod +x bin/node
          ./bin/node --version

      - name: Build with PyInstaller
        run: pyinstaller VideoGenerator.spec

      - name: Create DMG
        run: |
          chmod +x scripts/make_dmg.sh
          ./scripts/make_dmg.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SemanticAllInOne-macOS
          path: |
            dist/SemanticAllInOne.dmg
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Windows (.exe onedir)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Fetch ffmpeg (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = "ffmpeg-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath ffmpeg_dl -Force
          $exe = Get-ChildItem -Path ffmpeg_dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in download" }
          Copy-Item $exe.FullName -Destination "bin\ffmpeg.exe"
          & "bin\ffmpeg.exe" -version | Select-Object -First 1

      - name: Set up Node.js (for npm install only — not what gets bundled)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install flow-engine dependencies
        run: |
          cd flow-engine
          npm install --omit=dev

      - name: Install YouTube browser-acquisition dependencies
        run: |
          cd providers/youtube/acquisition
          npm install --omit=dev

      - name: Bundle portable Node.js runtime (Windows x64)
        # Ships inside the app and runs flow-engine at runtime on the end user's
        # machine — separate from the setup-node above, which only runs `npm install`
        # during this CI build.
        shell: pwsh
        run: |
          $nodeVersion = "v24.19.0"
          $url = "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node_dl -Force
          Copy-Item "node_dl\node-$nodeVersion-win-x64\node.exe" -Destination "bin\node.exe"
          & "bin\node.exe" --version

      - name: Build with PyInstaller
        run: pyinstaller VideoGenerator.spec

      - name: Zip Windows onedir
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\SemanticAllInOne\*" -DestinationPath "dist\SemanticAllInOne-Windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SemanticAllInOne-Windows
          path: dist/SemanticAllInOne-Windows.zip
          if-no-files-found: error
          retention-days: 1

  upload-to-drive:
    name: Upload to Google Drive
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: SemanticAllInOne-macOS
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SemanticAllInOne-Windows
          path: artifacts

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Upload builds to Google Drive
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${GDRIVE_TOKEN}" ] || [ -z "${GDRIVE_FOLDER_ID}" ]; then
            echo "Missing GDRIVE_TOKEN or GDRIVE_FOLDER_ID secret."
            exit 1
          fi

          # Personal Google accounts have no Shared Drives, and service accounts
          # have no storage quota of their own — so we authenticate as the
          # personal account via OAuth (token generated locally with
          # `rclone authorize "drive"`) instead of a service account.
          export RCLONE_CONFIG_GDRIVE_TYPE=drive
          export RCLONE_CONFIG_GDRIVE_SCOPE=drive
          export RCLONE_CONFIG_GDRIVE_TOKEN="${GDRIVE_TOKEN}"
          export RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID="${GDRIVE_FOLDER_ID}"

          ls -lah artifacts/
          rclone copy artifacts "gdrive:" --drive-root-folder-id "${GDRIVE_FOLDER_ID}" -v
          echo "Uploaded to Drive folder ${GDRIVE_FOLDER_ID} (overwriting previous build)"
