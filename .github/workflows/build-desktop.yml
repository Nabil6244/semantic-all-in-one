name: Build Desktop Apps

on:
  push:
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Fetch ffmpeg (macOS, static arm64, pinned)
        env:
          # Pinned build id (timestamp_version) -> reproducible, and a moving
          # upstream "latest" can never silently change the release artifact.
          # Bump BUILD + both checksums together when intentionally upgrading.
          FFMPEG_BUILD: "1787073674_9.0.1"
          FFMPEG_SHA256: "393e4c395020a1cb7cbd77fbe00599ce69d1c6466fee0dbd59d13f86a81a1611"
          FFPROBE_SHA256: "7abc49fb2bdf2204f018e76dc6e0a8ae7643313bae09a9fa43e7eb12442271bc"
        run: |
          set -euo pipefail
          mkdir -p bin
          # NOT `brew install ffmpeg`: Homebrew's binary links ~17 dylibs under
          # /opt/homebrew and cannot run on an end-user Mac without a matching
          # Homebrew install. These builds are genuinely self-contained
          # (System frameworks + /usr/lib only) and native arm64.
          BASE="https://ffmpeg.martin-riedl.de/download/macos/arm64/${FFMPEG_BUILD}"
          curl -fsSL --retry 3 --retry-delay 5 -o ffmpeg.zip  "${BASE}/ffmpeg.zip"
          curl -fsSL --retry 3 --retry-delay 5 -o ffprobe.zip "${BASE}/ffprobe.zip"
          unzip -o -q ffmpeg.zip  -d bin
          unzip -o -q ffprobe.zip -d bin
          chmod +x bin/ffmpeg bin/ffprobe
          rm -f ffmpeg.zip ffprobe.zip

          # Integrity: the build uses the exact binaries that were audited, or
          # it fails loudly rather than shipping something unverified.
          echo "${FFMPEG_SHA256}  bin/ffmpeg"   | shasum -a 256 -c -
          echo "${FFPROBE_SHA256}  bin/ffprobe" | shasum -a 256 -c -

          # Hard gate: a non-system dependency means it will not run on a clean
          # Mac. This is the check that the old Homebrew path only warned about.
          for b in bin/ffmpeg bin/ffprobe; do
            file "$b" | grep -q 'arm64' || { echo "::error::$b is not arm64"; exit 1; }
            leaks=$(otool -L "$b" | tail -n +2 | awk '{print $1}' \
                    | grep -vE '^/usr/lib/|^/System/' || true)
            if [ -n "$leaks" ]; then
              echo "::error::$b has non-system dependencies:"; echo "$leaks"; exit 1
            fi
            otool -L "$b" | grep -q VideoToolbox \
              || { echo "::error::$b lacks VideoToolbox (GPU encode)"; exit 1; }
          done
          ./bin/ffmpeg -version | head -1
          ./bin/ffprobe -version | head -1
          test -x bin/ffprobe

      - name: Run unit tests
        env:
          PATH: ${{ github.workspace }}/bin:${{ env.PATH }}
        run: python -m unittest discover -s . -p "test_*.py" -q

      - name: Set up Node.js (for npm install only — not what gets bundled)
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install flow-engine dependencies
        run: |
          cd flow-engine
          npm install --omit=dev

      - name: Install YouTube browser-acquisition dependencies
        run: |
          cd providers/youtube/acquisition
          npm install --omit=dev

      - name: Bundle portable Node.js runtime (macOS arm64)
        # Playwright Chromium is NOT bundled; app downloads it once on first Flow/AI use.
        run: |
          NODE_VERSION="v24.19.0"
          curl -sL -o node.tar.gz "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-arm64.tar.gz"
          tar -xzf node.tar.gz
          cp "node-${NODE_VERSION}-darwin-arm64/bin/node" bin/node
          chmod +x bin/node
          ./bin/node --version

      - name: Verify bundled SFX + ambience
        run: |
          python - <<'PY'
          from sfx.seed import MIN_BUNDLED_WAVS, bundled_sfx_inventory
          inv = bundled_sfx_inventory()
          print(inv)
          assert inv["ok"], inv
          assert inv["wav_count"] >= MIN_BUNDLED_WAVS
          assert inv["categories"].get("ambience", 0) > 0
          print(f"OK: {inv['wav_count']} wavs across {inv['categories']}")
          PY

      - name: Embed Supabase credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/embed_supabase.py

      - name: Build with PyInstaller
        run: pyinstaller VideoGenerator.spec

      # ---- Code signing + notarization (Phase 1.3) ----
      # Fully optional and additive: with no signing secrets configured in
      # this repo, every step below is skipped and the build is identical to
      # before (unsigned .app / .dmg). Once a paid Apple Developer account is
      # available, add these repo secrets to turn it on — nothing else needs
      # to change:
      #   MACOS_CERTIFICATE            base64 of a Developer ID Application
      #                                 .p12 export (`base64 -i cert.p12`)
      #   MACOS_CERTIFICATE_PWD        password the .p12 was exported with
      #   MACOS_CODESIGN_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
      #   MACOS_KEYCHAIN_PASSWORD      any password — protects the throwaway
      #                                 CI keychain created below, not an
      #                                 Apple credential
      #   APPLE_ID                     Apple ID email for notarization
      #   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that Apple ID
      #   APPLE_TEAM_ID                Developer Team ID
      # No secret value is ever written to source control by these steps —
      # they exist only in GitHub's encrypted secret store for this repo.
      - name: Check for macOS signing secrets
        id: signing_check
        run: |
          if [ -n "${{ secrets.MACOS_CERTIFICATE }}" ] && \
             [ -n "${{ secrets.MACOS_CERTIFICATE_PWD }}" ] && \
             [ -n "${{ secrets.MACOS_CODESIGN_IDENTITY }}" ] && \
             [ -n "${{ secrets.MACOS_KEYCHAIN_PASSWORD }}" ] && \
             [ -n "${{ secrets.APPLE_ID }}" ] && \
             [ -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ] && \
             [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets not configured — building an unsigned .dmg (unchanged from before Phase 1.3)."
          fi

      - name: Import signing certificate
        if: steps.signing_check.outputs.enabled == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

      - name: Code-sign the app bundle
        if: steps.signing_check.outputs.enabled == 'true'
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: ./scripts/codesign_macos_app.sh

      - name: Create DMG
        run: |
          chmod +x scripts/make_dmg.sh
          ./scripts/make_dmg.sh

      - name: Notarize and staple DMG
        if: steps.signing_check.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/notarize_macos_dmg.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v5
        with:
          name: Semantic-YT-Studio.dmg
          path: dist/Semantic-YT-Studio.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows (Setup.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Fetch ffmpeg (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          # Prefer BtbN (GitHub Releases). Gyan.dev often returns 503 under load.
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )
          $zip = "ffmpeg-win64.zip"
          $ok = $false
          foreach ($url in $urls) {
            Write-Host "Downloading ffmpeg from $url"
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
              $ok = $true
              break
            } catch {
              Write-Warning "Failed: $($_.Exception.Message)"
              Remove-Item $zip -ErrorAction SilentlyContinue
            }
          }
          if (-not $ok) { throw "Could not download ffmpeg from any mirror" }
          Expand-Archive -Path $zip -DestinationPath ffmpeg_dl -Force
          $exe = Get-ChildItem -Path ffmpeg_dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in download" }
          Copy-Item $exe.FullName -Destination "bin\ffmpeg.exe"
          & "bin\ffmpeg.exe" -version | Select-Object -First 1
          $probe = Get-ChildItem -Path ffmpeg_dl -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $probe) { throw "ffprobe.exe not found in download" }
          Copy-Item $probe.FullName -Destination "bin\ffprobe.exe"

      - name: Run unit tests
        shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;" + $env:PATH
          python -m unittest discover -s . -p "test_*.py" -q

      - name: Set up Node.js (for npm install only — not what gets bundled)
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install flow-engine dependencies
        run: |
          cd flow-engine
          npm install --omit=dev

      - name: Install YouTube browser-acquisition dependencies
        run: |
          cd providers/youtube/acquisition
          npm install --omit=dev

      - name: Bundle portable Node.js runtime (Windows x64)
        shell: pwsh
        run: |
          $nodeVersion = "v24.19.0"
          $url = "https://nodejs.org/dist/$nodeVersion/node-$nodeVersion-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node_dl -Force
          Copy-Item "node_dl\node-$nodeVersion-win-x64\node.exe" -Destination "bin\node.exe"
          & "bin\node.exe" --version

      - name: Verify bundled SFX + ambience
        run: |
          python -c "from sfx.seed import MIN_BUNDLED_WAVS, bundled_sfx_inventory; inv = bundled_sfx_inventory(); print(inv); assert inv['ok'], inv; assert inv['wav_count'] >= MIN_BUNDLED_WAVS; assert inv['categories'].get('ambience', 0) > 0"

      - name: Embed Supabase credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/embed_supabase.py

      - name: Build with PyInstaller
        run: pyinstaller VideoGenerator.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          & $iscc "scripts\windows_setup.iss"
          if (-not (Test-Path "dist\Semantic-YT-Studio-Setup.exe")) {
            throw "Setup.exe was not produced"
          }

      - name: Upload Windows Setup.exe
        uses: actions/upload-artifact@v5
        with:
          name: Semantic-YT-Studio-Setup.exe
          path: dist/Semantic-YT-Studio-Setup.exe
          if-no-files-found: error
          retention-days: 14
