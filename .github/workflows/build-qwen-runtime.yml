name: Build Qwen Runtime

# Relocatable Qwen3-TTS Python env for in-app Download (no model weights).
# Uses python-build-standalone (NOT `python -m venv`, which creates broken
# symlinks to the CI machine's framework Python).

on:
  workflow_dispatch:
  push:
    paths:
      - "requirements-qwen-tts.txt"
      - ".github/workflows/build-qwen-runtime.yml"

env:
  PBS_TAG: "20251209"
  PBS_PY: "3.12.12"

jobs:
  runtime-windows-x64:
    name: Runtime Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download standalone CPython
        shell: pwsh
        run: |
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/$env:PBS_TAG/cpython-$env:PBS_PY+$env:PBS_TAG-x86_64-pc-windows-msvc-install_only_stripped.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile pbs.tgz
          New-Item -ItemType Directory -Force -Path qwen-runtime-win-amd64 | Out-Null
          tar -xzf pbs.tgz -C qwen-runtime-win-amd64
          # install_only layout: python/python.exe
          $py = Get-ChildItem -Path qwen-runtime-win-amd64 -Recurse -Filter python.exe |
            Where-Object { $_.FullName -match '\\python\\python\.exe$' -or $_.Directory.Name -eq 'python' } |
            Select-Object -First 1
          if (-not $py) {
            $py = Get-ChildItem -Path qwen-runtime-win-amd64 -Recurse -Filter python.exe | Select-Object -First 1
          }
          if (-not $py) { throw "python.exe not found in standalone archive" }
          Write-Host "Using $($py.FullName)"
          & $py.FullName -m pip install --upgrade pip
          & $py.FullName -m pip install -r requirements-qwen-tts.txt
          & $py.FullName -c "import qwen_tts; print('qwen_tts ok', qwen_tts.__file__)"

      - name: Pack flat zip
        shell: pwsh
        run: |
          # Zip contents of the runtime folder (not the folder wrapper) so extract is flat.
          Compress-Archive -Path "qwen-runtime-win-amd64\*" -DestinationPath "qwen-runtime-win-amd64.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "qwen-runtime-win-amd64.zip").Hash.ToLower()
          Set-Content -Path "qwen-runtime-win-amd64.sha256" -Value "$hash  qwen-runtime-win-amd64.zip"
          Get-Content "qwen-runtime-win-amd64.sha256"
          Get-Item "qwen-runtime-win-amd64.zip" | Format-List Name, Length

      - name: Upload Windows runtime
        uses: actions/upload-artifact@v4
        with:
          name: qwen-runtime-win-amd64
          path: |
            qwen-runtime-win-amd64.zip
            qwen-runtime-win-amd64.sha256
          if-no-files-found: error
          retention-days: 14

  runtime-macos-arm64:
    name: Runtime macOS arm64
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download standalone CPython
        run: |
          set -euo pipefail
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_TAG}/cpython-${PBS_PY}+${PBS_TAG}-aarch64-apple-darwin-install_only_stripped.tar.gz"
          curl -sL "$URL" -o pbs.tgz
          mkdir -p qwen-runtime-darwin-arm64
          tar -xzf pbs.tgz -C qwen-runtime-darwin-arm64
          # install_only layout: python/bin/python3
          PY=$(find qwen-runtime-darwin-arm64 -type f \( -name python3 -o -name python \) | head -1)
          if [ -z "$PY" ]; then
            PY=$(find qwen-runtime-darwin-arm64 -type f -name 'python3.*' | head -1)
          fi
          if [ -z "$PY" ] || [ ! -x "$PY" ]; then
            echo "python binary not found"; find qwen-runtime-darwin-arm64 -maxdepth 3 -type f | head -40
            exit 1
          fi
          chmod +x "$PY"
          echo "Using $PY"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r requirements-qwen-tts.txt
          "$PY" -c "import qwen_tts; print('qwen_tts ok', qwen_tts.__file__)"

      - name: Pack flat zip
        run: |
          set -euo pipefail
          # Flat zip of runtime contents (not a nested tar.gz wrapper).
          (
            cd qwen-runtime-darwin-arm64
            zip -ry ../qwen-runtime-darwin-arm64.zip .
          )
          shasum -a 256 qwen-runtime-darwin-arm64.zip | tee qwen-runtime-darwin-arm64.sha256
          ls -lh qwen-runtime-darwin-arm64.zip
          # Sanity: zip must contain a real python binary path
          unzip -l qwen-runtime-darwin-arm64.zip | grep -E 'python(3(\.[0-9]+)?)?$' | head -5

      - name: Upload macOS runtime
        uses: actions/upload-artifact@v4
        with:
          name: qwen-runtime-darwin-arm64
          path: |
            qwen-runtime-darwin-arm64.zip
            qwen-runtime-darwin-arm64.sha256
          if-no-files-found: error
          retention-days: 14
