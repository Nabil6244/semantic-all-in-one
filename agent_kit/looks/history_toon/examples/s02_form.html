<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/agent_kit/looks/history_toon/look.css"></head>
<body><div id="cam" class="abs" style="inset:0;transform-origin:50% 50%"><svg id="s" width="1920" height="1080" class="abs" style="inset:0"></svg></div>
<div class="vignette"></div><div class="grain"></div>
<script type="module">
import * as K from '/agent_kit/lib/kit.js';
import * as H from '/agent_kit/looks/history_toon/props.js';
import { P } from '/agent_kit/looks/history_toon/palette.js';
window.sceneReady = document.fonts.ready;
const D = 4.5;
window.renderAt = async (t) => {
  let g = H.defs() + H.deskTop();
  const f = H.paperForm(t, { title: 'SORTIE REPORT', rows: [
    { label: 'PILOT:', value: 'Alive', at: 0.4, check: 1.0 },
    { label: 'AIRCRAFT:', value: 'Returned', at: 1.3 },
    { label: 'MISSION:', value: 'Failed', at: 2.3, color: P.red },
  ], k: K.prog(t, 0, 0.4) });
  g += f.svg + H.stamp(t, 3.4, 1150, 640, 'SENT BACK');
  if (f.pen) g += H.penHand(f.pen[0], f.pen[1]);
  s.innerHTML = g;
  cam.style.transform = K.drift(t, D, { zoom: 0.05, x: 0, y: -10 });
};
</script></body></html>
